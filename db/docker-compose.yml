# PostgreSQL with TimescaleDB and PostGIS, and a single-node Kafka broker.
# Run from db/: docker compose --env-file ../backend/.env up -d
services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: flood_pipeline_db
    environment:
      POSTGRES_DB: ${DB_NAME:-flood_pipeline}
      POSTGRES_USER: ${DB_USER:-flood_pipeline}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, run with --env-file ../backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - flood_pipeline_data:/home/postgres/pgdata/data
      - ./init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  kafka:
    # Official Apache Kafka image.
    image: apache/kafka:4.2.2
    container_name: flood_pipeline_kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft mode: this one container is both broker and
      # controller, so no separate Zookeeper service is needed.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # The client listener binds to 0.0.0.0 so Docker's port forwarding reaches it;
      # clients on the host are told to use localhost (ADVERTISED_LISTENERS).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped

volumes:
  flood_pipeline_data:
