# PostgreSQL with TimescaleDB and PostGIS (proposal 3.4.4), plus a
# single-node Apache Kafka broker (proposal 3.5.2/3.6.3) for the
# ingestion and stream processing layers.
# Run from the db/ directory: docker compose up -d
services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: flood_pipeline_db
    environment:
      POSTGRES_DB: flood_pipeline
      POSTGRES_USER: flood_pipeline
      POSTGRES_PASSWORD: flood_pipeline_dev
    ports:
      - "5432:5432"
    volumes:
      - flood_pipeline_data:/home/postgres/pgdata/data
      - ./init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  kafka:
    # Official Apache Kafka image (bitnami/kafka's free tags were
    # withdrawn from Docker Hub after this was first written; see
    # https://hub.docker.com/r/apache/kafka).
    image: apache/kafka:4.2.2
    container_name: flood_pipeline_kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft mode: this one container is both broker and
      # controller, so no separate Zookeeper service is needed.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # The broker's own client-facing listener (PLAINTEXT) must bind to
      # 0.0.0.0, not localhost: Docker's port forwarding from the host
      # lands on the container's external interface, and a socket bound
      # only to the container's own loopback never sees that traffic,
      # which is what was causing every host-side connection to reset
      # immediately (see Docker's own Kafka guide for this pattern).
      # ADVERTISED_LISTENERS is what the host-side client is told to use
      # for all subsequent connections, so that one does stay "localhost".
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped

volumes:
  flood_pipeline_data:
