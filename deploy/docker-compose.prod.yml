# Production stack for one Azure VM. Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
# Only Caddy publishes ports; the database, Kafka and the backend are reachable only inside this network.
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./backups:/backups
    shm_size: 256mb
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Kept small so the whole stack fits in the 4 GB B2s VM
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    image: flood-app:latest
    env_file: .env
    environment:
      DB_HOST: db
      KAFKA_BROKER: kafka:9092
      # Caddy is the one proxy in front, so the client address for rate limits comes from its X-Forwarded-For
      TRUSTED_PROXIES: "1"
    depends_on: [db]
    restart: unless-stopped

  consumer:
    image: flood-app:latest
    env_file: .env
    environment:
      DB_HOST: db
      KAFKA_BROKER: kafka:9092
      DETECTION_URL: http://backend:5001/internal/detect
    working_dir: /app/ingestion
    command: ["python", "consumer.py"]
    depends_on: [db, kafka, backend]
    restart: unless-stopped

  # Run on a schedule from the VM's crontab (deploy/crontab), not kept running
  producer:
    image: flood-app:latest
    env_file: .env
    environment:
      DB_HOST: db
      KAFKA_BROKER: kafka:9092
      EE_SERVICE_ACCOUNT_KEY: ${EE_SERVICE_ACCOUNT_KEY:-}
    volumes:
      - ./secrets:/secrets:ro
      - ./secrets/earthengine:/home/app/.config/earthengine:ro  # the image runs as the user app
    working_dir: /app/ingestion
    entrypoint: ["python", "producer.py"]
    profiles: ["jobs"]
    depends_on: [kafka]

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      REDIRECT_ADDRESSES: ${REDIRECT_ADDRESSES}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dashboard:/srv/dashboard:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  caddydata:
  caddyconfig:
