<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flood Risk Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Google Identity Services, for the "Sign in with Google" button
         (App.jsx's LoginForm). Loaded with no "integrity"/blocking
         behaviour that would hold up the rest of the page if it can't
         reach google.com, since this whole app is deliberately built
         to still work with no internet connection at all. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
